# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - id: "sandbox-mcp"
    # Path to main.go file or main package
    main: ./cmd/sandbox-mcp/main.go
    # Binary name
    binary: sandbox-mcp
    env:
      - CGO_ENABLED=0
    # The version is read at runtime to build the release asset URL that --pull
    # downloads from. Without these flags every released binary keeps the "dev"
    # default and asks for .../download/dev/sandboxes.tar.gz, which 404s.
    # .Tag is used rather than .Version because the asset path needs the leading
    # "v" that .Version strips.
    ldflags:
      - -s -w
      - -X github.com/pottekkat/sandbox-mcp/internal/version.Version={{ .Tag }}
      - -X github.com/pottekkat/sandbox-mcp/internal/version.CommitSHA={{ .ShortCommit }}
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
